; PlatformIO project — tremor-orthosis
; Build:   pio run -e mock          (Joseph's kit: IMUs only, fake motors)
;          pio run -e openloop      (Louis: sine torque, no estimator)
; Upload:  pio run -e mock -t upload
; Monitor: pio device monitor

[platformio]
default_envs = mock

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 921600
build_flags = -Wall -O2
; SimpleFOC is added by the motor driver task (L-2.3). Note: SimpleFOC >= 2.3.4
; requires Arduino-ESP32 3.x, which this platform version does not ship.

; Joseph: real IMUs, mock motors, real controller
[env:mock]
build_flags = ${env.build_flags} -DUSE_MOCK_MOTORS

; Louis: open-loop sine torque instead of the controller.
; Uses the mock motors until drivers/motors.cpp (L-2.3) exists; then remove
; -DUSE_MOCK_MOTORS from this env.
[env:openloop]
build_flags = ${env.build_flags} -DUSE_MOCK_MOTORS -DUSE_OPENLOOP_TEST
