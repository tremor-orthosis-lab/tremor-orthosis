name: build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [mock, openloop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e ${{ matrix.env }}
